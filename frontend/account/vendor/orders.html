<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Vendor Orders | Sell4Life</title>

    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/vendor.css" />
  </head>

  <body>
    <div class="vendor-layout">
      <!-- Sidebar injected by layout.js -->
      <div id="vendor-sidebar"></div>

      <main class="vendor-main">
        <div class="vendor-container">
          <a href="/account/vendor/dashboard.html" class="vendor-back-link">
            ← Back to dashboard
          </a>

          <h1 class="vendor-title">Orders</h1>

          <div class="vendor-search">
            <input type="text" id="vendorOrderSearch" placeholder="Search Order ID (S4L-...)" />
          </div>

          <div class="vendor-filters">
            <button class="filter-btn active" data-status="all">All</button>
            <button class="filter-btn" data-status="active">Active</button>
            <button class="filter-btn" data-status="issues">Issues</button>
            <button class="filter-btn" data-status="completed">Completed</button>
          </div>

          <div id="vendor-orders" class="vendor-orders-list">
            <p class="orders-loading">Loading orders...</p>
          </div>
        </div>
      </main>
    </div>

    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/config-global.js"></script>
    <script src="/assets/js/vendor-orders.js"></script>
  </body>
</html>
